<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Open source</title>
  <desc id="desc">Open source, shipped in public, with a network of contribution areas.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#241f38" stroke-width="1" opacity=".55"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fe428e"/>
      <stop offset="50%" stop-color="#a9fef7"/>
      <stop offset="100%" stop-color="#f8d847"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .spin { transform-origin: 780px 120px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </defs>
  <rect width="1000" height="240" rx="18" fill="#0d0b16"/>
  <rect width="1000" height="240" rx="18" fill="url(#grid)"/>
  <circle cx="780" cy="120" r="260" fill="url(#glow)"/>
  <text x="54" y="82" class="mono" font-size="12" fill="#a9fef7" letter-spacing="3" opacity=".8">02 / CONTRIBUTION LOG</text>
  <text x="50" y="148" class="sans" font-size="58" font-weight="800" fill="#f7f5ff" letter-spacing="-2">OPEN SOURCE</text>
  <text x="54" y="180" class="mono" font-size="15" fill="#fe428e" letter-spacing="3">SHIPPED IN PUBLIC</text>
  <line x1="54" y1="202" x2="420" y2="202" stroke="url(#rule)" stroke-width="2"/>
  <text x="54" y="224" class="mono" font-size="10" fill="#8c88a6" letter-spacing="1.4">RUST / TYPESCRIPT / C++ / GO / PYTHON</text>

  <g class="spin" opacity=".9">
    <circle cx="780" cy="120" r="86" fill="none" stroke="#fe428e" stroke-width="1" stroke-dasharray="3 10" opacity=".35"/>
    <circle cx="780" cy="34" r="4" fill="#fe428e"/>
    <circle cx="866" cy="120" r="3.5" fill="#a9fef7"/>
    <circle cx="780" cy="206" r="4" fill="#f8d847"/>
    <circle cx="694" cy="120" r="3.5" fill="#a9fef7"/>
  </g>
  <g opacity=".9">
    <line x1="780" y1="120" x2="618" y2="60" stroke="#fe428e" stroke-width="1" opacity=".45"/>
    <line x1="780" y1="120" x2="612" y2="120" stroke="#a9fef7" stroke-width="1" opacity=".4"/>
    <line x1="780" y1="120" x2="618" y2="180" stroke="#f8d847" stroke-width="1" opacity=".4"/>
    <line x1="780" y1="120" x2="694" y2="34" stroke="#a9fef7" stroke-width="1" opacity=".35"/>
    <line x1="780" y1="120" x2="866" y2="34" stroke="#fe428e" stroke-width="1" opacity=".35"/>
    <line x1="780" y1="120" x2="942" y2="66" stroke="#f8d847" stroke-width="1" opacity=".3"/>
    <line x1="780" y1="120" x2="942" y2="120" stroke="#a9fef7" stroke-width="1" opacity=".3"/>
    <line x1="780" y1="120" x2="942" y2="174" stroke="#fe428e" stroke-width="1" opacity=".3"/>
    <line x1="780" y1="120" x2="866" y2="206" stroke="#f8d847" stroke-width="1" opacity=".3"/>
  </g>
  <circle cx="780" cy="120" r="28" fill="#141321" stroke="#a9fef7" stroke-width="1.5"/>
  <text x="780" y="118" class="mono" font-size="8" fill="#a9fef7" text-anchor="middle" letter-spacing="1">AMIT</text>
  <text x="780" y="130" class="mono" font-size="6" fill="#8c88a6" text-anchor="middle" letter-spacing="1">/OSS</text>
  <g>
    <circle cx="618" cy="60" r="5" fill="#fe428e"/><circle cx="612" cy="120" r="5" fill="#a9fef7"/>
    <circle cx="618" cy="180" r="5" fill="#f8d847"/><circle cx="694" cy="34" r="4" fill="#a9fef7"/>
    <circle cx="866" cy="34" r="4" fill="#fe428e"/><circle cx="942" cy="66" r="4" fill="#f8d847"/>
    <circle cx="942" cy="120" r="4" fill="#a9fef7"/><circle cx="942" cy="174" r="4" fill="#fe428e"/>
    <circle cx="866" cy="206" r="4" fill="#f8d847"/>
  </g>
</svg>
